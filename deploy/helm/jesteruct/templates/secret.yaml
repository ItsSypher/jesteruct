{{- if and .Values.openrouter.apiKey (not .Values.openrouter.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jesteruct.openrouterSecret" . }}
  labels:
    {{- include "jesteruct.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.openrouter.secretKey }}: {{ .Values.openrouter.apiKey | quote }}
{{- end }}
