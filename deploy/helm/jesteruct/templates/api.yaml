apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jesteruct.fullname" . }}-api
  labels:
    {{- include "jesteruct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "jesteruct.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jesteruct.selector" (list . "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "jesteruct.checksums" . | nindent 8 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
    spec:
      {{- include "jesteruct.podSpec" . | nindent 6 }}
      containers:
        - name: api
          {{- include "jesteruct.container" . | nindent 10 }}
          {{- with include "jesteruct.valkeyEnv" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          args: ["serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jesteruct.fullname" . }}-api
  labels:
    {{- include "jesteruct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "jesteruct.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
