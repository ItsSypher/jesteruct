apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: create-bucket
          image: {{ .Values.seaweedfs.image }}
          env:
            - name: BUCKET
              value: {{ .Values.seaweedfs.bucket | quote }}
          # weed shell waits for the master, and create is a no-op when the bucket exists; the listing proves it.
          command:
            - /bin/sh
            - -c
            - |
              echo "s3.bucket.create -name $BUCKET" | weed shell -master=seaweedfs:9333
              echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -w "$BUCKET"
