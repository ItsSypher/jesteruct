{{- $s3 := .Values.seaweedfs }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  s3.json: |
    {{- dict "identities" (list (dict
      "name" "app"
      "credentials" (list (dict "accessKey" $s3.accessKey "secretKey" $s3.secretKey))
      "actions" (list (printf "Read:%s" $s3.bucket) (printf "Write:%s" $s3.bucket) (printf "List:%s" $s3.bucket))
    )) | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $s3.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # one pod owns the volume
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
      annotations:
        checksum/s3: {{ $s3 | toJson | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seaweedfs
          image: {{ $s3.image }}
          # The image entrypoint adds -dir=/data and sizes volumes to the disk.
          args: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
          ports:
            - {name: s3, containerPort: 8333}
            - {name: master, containerPort: 9333}
            - {name: master-grpc, containerPort: 19333}
          readinessProbe:
            httpGet: {path: /healthz, port: s3}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - {name: s3, port: 8333, targetPort: s3}
    - {name: master, port: 9333, targetPort: master}
    - {name: master-grpc, port: 19333, targetPort: master-grpc}
